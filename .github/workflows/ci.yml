name: CI

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── 前端：lint + typecheck + build ──────────────────────────
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc -b --noEmit

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

  # ── 后端：lint + test ──────────────────────────────────────
  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: resume_agent_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/resume_agent_test
      REDIS_URL: redis://localhost:6379/0
      PLATFORM_TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/resume_agent_test
      PLATFORM_TEST_REDIS_URL: redis://localhost:6379/15
      SECRET_KEY: test-secret-key-for-ci
      LLM_API_KEY: sk-test-placeholder
      LLM_BASE_URL: https://api.openai.com/v1
      LLM_MODEL: gpt-4o
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt ruff

      - name: Lint (ruff)
        run: ruff check . --output-format=github

      - name: Test (pytest)
        run: pytest tests/ -v --tb=short -p no:cacheprovider

  docker:
    name: Full stack, fault matrix and immutable images
    runs-on: ubuntu-latest
    needs: [frontend, backend]
    env:
      TEST_BACKEND_IMAGE: resume-agent-backend:${{ github.sha }}
      TEST_FRONTEND_IMAGE: resume-agent-frontend:${{ github.sha }}
      E2E_BASE_URL: http://127.0.0.1:18080
      E2E_ADMIN_USERNAME: ci_admin
      E2E_ADMIN_PASSWORD: disposable-admin-password-2026
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: pip install httpx==0.27.0
      - name: Release script syntax
        run: bash -n scripts/deploy-release.sh scripts/rollback-release.sh
      - run: npm ci && npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Build the exact release images
        run: |
          docker build --label org.opencontainers.image.revision=${{ github.sha }} -t "$TEST_BACKEND_IMAGE" ./backend
          docker build --label org.opencontainers.image.revision=${{ github.sha }} -t "$TEST_FRONTEND_IMAGE" ./frontend
      - name: Start isolated real-mode protocol stack
        run: docker compose -p resumeagent-engineering-test -f docker-compose.test.yml up -d --no-build --wait --wait-timeout 180
      - name: Alert firing and healthy-state rules
        run: docker compose -p resumeagent-engineering-test -f docker-compose.test.yml --profile monitoring run --rm --no-deps alerts
      - name: Independent process kills and Redis loss
        run: python backend/tests/fault_matrix.py
      - name: Bounded dual-instance load and provider circuit probe
        run: python backend/tests/capacity_probe.py
      - name: Explicit demo stack for browser acceptance
        env:
          TEST_DEMO_MODE: "true"
        run: |
          docker compose -p resumeagent-engineering-test -f docker-compose.test.yml up -d --no-build --wait --wait-timeout 180
          docker compose -p resumeagent-engineering-test -f docker-compose.test.yml exec -T backend python -c "import asyncio; from app.platform.cli import create_admin; asyncio.run(create_admin('ci_admin', 'disposable-admin-password-2026'))"
      - run: npm run test:e2e && npm run test:e2e:admin
        working-directory: frontend
      - name: Save tested images and release sources
        if: github.event_name == 'push'
        run: |
          mkdir -p release/operations release/scripts
          docker save "$TEST_BACKEND_IMAGE" | gzip > release/backend.tar.gz
          docker save "$TEST_FRONTEND_IMAGE" | gzip > release/frontend.tar.gz
          cp docker-compose.yml release/
          cp operations/* release/operations/
          cp scripts/deploy-release.sh scripts/rollback-release.sh release/scripts/
          cd release && sha256sum *.tar.gz > SHA256SUMS
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push'
        with:
          name: release-${{ github.sha }}
          path: release/
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: engineering-evidence
          include-hidden-files: true
          path: |
            backend/.test-work/faults/
            frontend/test-results/
      - name: Stop isolated stack
        if: always()
        run: docker compose -p resumeagent-engineering-test -f docker-compose.test.yml down -v
