services:
  # 前端：Nginx 代理 + 静态文件
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "8000:80"
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  # 后端：FastAPI
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    volumes:
      - uploads:/app/uploads
    env_file:
      - ./backend/.env
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - python3 -c "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)"
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 45s
    restart: unless-stopped

  # Celery 异步任务
  celery:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: celery -A app.tasks.celery_app worker --loglevel=info -Q default
    volumes:
      - uploads:/app/uploads
    env_file:
      - ./backend/.env
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - celery -A app.tasks.celery_app inspect ping >/dev/null 2>&1 || exit 1
      interval: 60s
      timeout: 15s
      retries: 10
      start_period: 60s
    restart: unless-stopped

  # Explicit, versioned schema upgrade before web/worker processes start.
  migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: python -m app.platform.cli migrate
    env_file:
      - ./backend/.env
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  outbox:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: python -m app.platform.worker
    env_file:
      - ./backend/.env
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped

  # PostgreSQL 数据库
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: resume_agent
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # Redis
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  uploads:
