services:
  # 前端：Nginx 代理 + 静态文件
  frontend:
    mem_limit: ${FRONTEND_MEMORY_LIMIT:-128m}
    image: ${FRONTEND_IMAGE:-resumeagent-frontend:local}
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "8000:80"
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  # 后端：FastAPI
  backend:
    mem_limit: ${BACKEND_MEMORY_LIMIT:-1g}
    image: ${BACKEND_IMAGE:-resumeagent-backend:local}
    build:
      context: ./backend
      dockerfile: Dockerfile
    volumes:
      - uploads:/app/uploads
    env_file:
      - ./backend/.env
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
      test:
        - CMD-SHELL
        - python3 -c "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready', timeout=5)"
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 45s
    restart: unless-stopped

  # Celery 异步任务
  celery: &worker
    mem_limit: ${WORKER_MEMORY_LIMIT:-2g}
    image: ${BACKEND_IMAGE:-resumeagent-backend:local}
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: celery -A app.tasks.celery_app worker --loglevel=info --concurrency=2 -Q prepare,default
    environment:
      SERVICE_ROLE: worker
    volumes:
      - uploads:/app/uploads
    env_file:
      - ./backend/.env
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - python -m app.platform.operations.health
      interval: 60s
      timeout: 15s
      retries: 10
      start_period: 60s
    restart: unless-stopped

  # Explicit, versioned schema upgrade before web/worker processes start.
  migrate:
    image: ${BACKEND_IMAGE:-resumeagent-backend:local}
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: python -m app.platform.cli migrate
    env_file:
      - ./backend/.env
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  celery-report:
    <<: *worker
    mem_limit: ${REPORT_MEMORY_LIMIT:-1g}
    command: celery -A app.tasks.celery_app worker --loglevel=info --concurrency=1 -Q report

  outbox:
    mem_limit: ${OPERATIONS_MEMORY_LIMIT:-256m}
    image: ${BACKEND_IMAGE:-resumeagent-backend:local}
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: python -m app.platform.worker
    environment:
      SERVICE_ROLE: dispatcher
    healthcheck:
      test: ["CMD", "python", "-m", "app.platform.operations.health"]
      interval: 30s
      timeout: 15s
      retries: 3
    env_file:
      - ./backend/.env
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped

  inspector:
    mem_limit: ${OPERATIONS_MEMORY_LIMIT:-256m}
    image: ${BACKEND_IMAGE:-resumeagent-backend:local}
    build: ./backend
    command: python -m app.platform.operations.recovery
    environment:
      SERVICE_ROLE: inspector
    env_file: ./backend/.env
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-m", "app.platform.operations.health"]
      interval: 30s
      timeout: 15s
      retries: 3
    restart: unless-stopped

  metrics:
    mem_limit: ${OPERATIONS_MEMORY_LIMIT:-256m}
    image: ${BACKEND_IMAGE:-resumeagent-backend:local}
    build: ./backend
    command: uvicorn app.platform.operations.metrics:app --host 0.0.0.0 --port 9090
    env_file: ./backend/.env
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  prometheus:
    mem_limit: ${MONITORING_MEMORY_LIMIT:-512m}
    image: prom/prometheus:v3.2.1
    profiles: [monitoring]
    volumes:
      - ./operations/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./operations/alerts.yml:/etc/prometheus/alerts.yml:ro
    depends_on: [metrics]

  # PostgreSQL 数据库
  postgres:
    mem_limit: ${POSTGRES_MEMORY_LIMIT:-1g}
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: resume_agent
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # Redis
  redis:
    mem_limit: ${REDIS_MEMORY_LIMIT:-512m}
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  uploads:
