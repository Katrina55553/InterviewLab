global:
  resolve_timeout: 1m
route:
  receiver: platform-operations
  group_by: [alertname]
  group_wait: 5s
  group_interval: 10s
  repeat_interval: 4h
receivers:
  - name: platform-operations
    webhook_configs:
      - url_file: /etc/alertmanager/receiver.url
        send_resolved: true
        max_alerts: 20
