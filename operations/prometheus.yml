global:
  scrape_interval: 15s
rule_files: [/etc/prometheus/alerts.yml]
alerting:
  alertmanagers:
    - static_configs:
        - targets: [alertmanager:9093]
scrape_configs:
  # One database-derived exporter counts all prefork children and backend replicas.
  - job_name: platform
    static_configs:
      - targets: [metrics:9090]
